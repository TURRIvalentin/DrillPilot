repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        exclude: ^tests/
        # pydantic/fastapi ship real inline types (unlike sklearn, which is why its
        # base classes need `# type: ignore[misc]` at the call site instead) -- without
        # these installed in the hook's isolated env, BaseModel/APIRouter resolve to
        # Any and mypy silently stops checking backend/ instead of raising real errors.
        additional_dependencies: ["pydantic>=2", "fastapi"]
